id: fr.arsenelapostolet.PandocGui
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.dotnet10
  - org.freedesktop.Sdk.Extension.texlive
build-options:
  prepend-path: "/usr/lib/sdk/dotnet10/bin"
  append-ld-library-path: "/usr/lib/sdk/dotnet10/lib"
  prepend-pkg-config-path: "/usr/lib/sdk/dotnet10/lib/pkgconfig"

command: PandocGui
finish-args:
  - --device=dri
  # TODO: Replace this with wayland and fallback-x11 once Wayland support
  #       becomes available:
  #       https://github.com/AvaloniaUI/Avalonia/pull/8003
  - --socket=x11
  - --share=ipc
  - --env=DOTNET_ROOT=/app/lib/dotnet
  - --env=PATH=EXT_DEST/texlive/bin:EXT_DEST/texlive/bin/aarch64-linux:EXT_DEST/texlive/bin/x86_64-linux:/app/bin:/usr/bin
  - --env=LD_LIBRARY_PATH=EXT_DEST/texlive/lib:EXT_DEST/texlive/lib/perl5/5.42.0/aarch64-linux/CORE:EXT_DEST/texlive/lib/perl5/5.42.0/x86_64-linux/CORE
  - --env=PERL5LIB=EXT_DEST/texlive/lib/perl5/5.42.0:EXT_DEST/texlive/lib/perl5/site_perl/5.42.0
modules:
  - name: Pandoc
    buildsystem: simple
    sources:
      - type: archive
        url: https://github.com/jgm/pandoc/releases/download/3.10.2/pandoc-3.10.2-linux-amd64.tar.gz
        sha256: c7edd535941c48be6a362081a748272837de81ae11777202d9c341d3d8261c9a
    build-commands:
      - install -Dm755 bin/pandoc /app/bin/pandoc
  - name: dotnet
    buildsystem: simple
    build-commands:
    - /usr/lib/sdk/dotnet10/bin/install.sh

  - name: PandocGui
    buildsystem: simple
    sources:
      - type: dir
        path: .
      - ./nuget-sources.json
    build-commands:
      - dotnet publish src/PandocGui/PandocGui.csproj -c Release --no-self-contained --source ./nuget-sources
      - mkdir -p ${FLATPAK_DEST}/bin
      - cp -r src/PandocGui/bin/Release/net10.0/publish/* ${FLATPAK_DEST}/bin
